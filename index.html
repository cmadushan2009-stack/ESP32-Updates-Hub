<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Updates Hub</title>
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: rgba(17, 24, 39, 0.75);
            --border-color: rgba(56, 189, 248, 0.25);
            --accent-glow: #38bdf8;
            --primary: #6366f1;
            --secondary: #ec4899;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success-bg: rgba(6, 78, 59, 0.6);
            --success-text: #34d399;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.2) 0%, transparent 45%),
                radial-gradient(circle at 90% 90%, rgba(56, 189, 248, 0.2) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.1) 0%, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 920px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-color);
            border-radius: 35px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), 0 0 60px rgba(56, 189, 248, 0.12);
            padding: 50px;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--accent-glow), var(--secondary));
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #f472b6);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        h3 {
            margin-top: 0;
            color: var(--accent-glow);
            font-size: 1.3rem;
            margin-bottom: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .box {
            background: rgba(10, 17, 34, 0.85);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 24px;
            margin-bottom: 35px;
            box-shadow: inset 0 0 25px rgba(56, 189, 248, 0.05);
            transition: all 0.35s ease;
        }

        .box:hover {
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 25px rgba(56, 189, 248, 0.08);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 500;
        }

        select {
            width: 100%;
            padding: 15px 18px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-main);
            font-size: 1.05rem;
            outline: none;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            transition: all 0.3s ease;
        }

        select:focus {
            border-color: var(--accent-glow);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
        }

        .details-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-glow);
            padding: 24px;
            margin-top: 22px;
            border-radius: 16px;
            display: none;
            word-break: break-word;
            animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .details-card p {
            color: var(--text-muted);
            margin-bottom: 10px;
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .details-card span {
            color: var(--text-main);
            font-weight: 500;
        }

        .badge {
            background-color: var(--success-bg);
            color: var(--success-text);
            font-size: 0.8rem;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            margin-left: 10px;
            display: inline-block;
            border: 1px solid rgba(52, 211, 153, 0.35);
        }

        /* Mobile-Friendly Table Wrapper */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: rgba(10, 17, 34, 0.85);
            box-shadow: inset 0 0 20px rgba(56, 189, 248, 0.03);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 520px;
        }

        th, td {
            text-align: left;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            font-size: 1rem;
        }

        th {
            background-color: rgba(30, 41, 59, 0.85);
            color: var(--accent-glow);
            white-space: nowrap;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        tr {
            transition: background 0.25s ease;
        }

        tr:hover {
            background-color: rgba(56, 189, 248, 0.05);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .btn-download {
            background: linear-gradient(135deg, var(--primary), var(--accent-glow));
            color: #ffffff;
            padding: 10px 22px;
            text-decoration: none;
            border-radius: 24px;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-block;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            box-shadow: 0 4px 18px rgba(56, 189, 248, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .btn-download:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.55);
            filter: brightness(1.15);
        }

        /* Responsive Breakpoints */
        @media (max-width: 600px) {
            body {
                padding: 15px 10px;
            }

            .container {
                padding: 22px;
                border-radius: 22px;
            }

            h1 {
                font-size: 1.7rem;
                margin-bottom: 25px;
            }

            .box {
                padding: 18px;
            }

            th, td {
                padding: 12px 14px;
                font-size: 0.9rem;
            }

            .btn-download {
                padding: 7px 14px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>♻️ ESP32 Updates Dashboard</h1>

    <!-- Dropdown Selector -->
    <div class="box">
        <h3>🔍 Select Version Details</h3>
        <div class="form-group">
            <label for="releaseSelect">Release Version:</label>
            <select id="releaseSelect" onchange="showReleaseDetails()">
                <option value="">-- Choose a Version --</option>
            </select>
        </div>

        <div id="releaseCard" class="details-card">
            <h4 id="detailTitle" style="margin-top:0; color: var(--text-main); font-size: 1.2rem; margin-bottom: 14px;"></h4>
            <p><strong>Release Date:</strong> <span id="detailDate"></span></p>
            <p><strong>File Name:</strong> <span id="detailFileName"></span></p>
            <p><strong>Notes:</strong> <span id="detailNotes"></span></p>
            <div style="margin-top: 18px;">
                <a id="detailDownload" href="#" class="btn-download" download>Download File</a>
            </div>
        </div>
    </div>

    <!-- Release Table -->
    <h3>📜 Release History</h3>
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Version</th>
                    <th>Release Date</th>
                    <th>File Name</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
    </div>
</div>

<script>
    // List of firmware / text updates
    const releases = [
        {
            version: "v1.260727",
            date: "2026-07-27",
            fileName: "update_v1.260727.txt",
            notes: "Basic version of the ESP32 robot car firmware.",
            url: "WRC260727.txt"
        },
        {
            version: "v1.260917",
            date: "2026-09-17",
            fileName: "update_v1.260917.txt",
            notes: "New features and bug fixes.",
            url: "WRC260917.txt"
        },
        {
            version: "v2.261201",
            date: "2026-12-01",
            fileName: "update_v2.261201.txt",
            notes: "New series unlocked and more user-friendly features (only add but not officially released).",
            url: ""
       }
    ];

    window.onload = function() {
        // Automatically sort releases by date descending (Newest date on top)
        releases.sort((a, b) => new Date(b.date) - new Date(a.date));

        const selectMenu = document.getElementById('releaseSelect');
        const tableBody = document.getElementById('tableBody');

        releases.forEach((rel, index) => {
            const isLatest = index === 0;
            const badgeText = isLatest ? " ⭐ (Latest)" : "";

            // Populate Dropdown
            const option = document.createElement('option');
            option.value = index;
            option.textContent = `${rel.version} ${badgeText}`;
            selectMenu.appendChild(option);

            // Populate Table
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><strong>${rel.version}</strong> ${isLatest ? '<span class="badge">LATEST</span>' : ''}</td>
                <td>${rel.date}</td>
                <td>${rel.fileName}</td>
                <td><a href="${rel.url}" class="btn-download" download>Download</a></td>
            `;
            tableBody.appendChild(row);
        });
    };

    // Display details card when a version is selected
    function showReleaseDetails() {
        const selectMenu = document.getElementById('releaseSelect');
        const card = document.getElementById('releaseCard');
        const index = selectMenu.value;

        if (index === "") {
            card.style.display = "none";
            return;
        }

        const rel = releases[index];
        document.getElementById('detailTitle').innerText = "Version " + rel.version;
        document.getElementById('detailDate').innerText = rel.date;
        document.getElementById('detailFileName').innerText = rel.fileName;
        document.getElementById('detailNotes').innerText = rel.notes;

        const downloadBtn = document.getElementById('detailDownload');
        downloadBtn.href = rel.url;

        card.style.display = "block";
    }
</script>

</body>
</html>
